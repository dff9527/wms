services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: wms_semiconductor
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次啟動(空 volume)自動建 schema + users/customers 表 + 供應商 seed。
      # 依檔名排序執行;volume 已存在時不會重跑。
      - ../change_requests/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../change_requests/stage_A3_A6_tables.sql:/docker-entrypoint-initdb.d/02_auth_tables.sql:ro
      - ../change_requests/seed_patterns.sql:/docker-entrypoint-initdb.d/03_seed_patterns.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_user -d wms_semiconductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://wms_user:wms_password@db:5432/wms_semiconductor
      REDIS_URL: redis://redis:6379/0
      # .env 被 .dockerignore 排除不會進映像;SECRET_KEY 必須在這裡給,
      # 正式環境(DEBUG=false)必須用 WMS_SECRET_KEY 覆蓋預設值,否則啟動即失敗。
      SECRET_KEY: ${WMS_SECRET_KEY:-dev-secret-change-me}
      DEBUG: ${WMS_DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
